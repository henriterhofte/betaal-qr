<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Betaal-QR tests</title>
</head>
<body>
  <!-- Tests voor epc.js. Draai met: chrome --headless --dump-dom file:///.../test.html
       De uitkomst staat in het pre-element met id "uitkomst"; de laatste regel is "ALLE TESTS GESLAAGD" of "MISLUKT: n". -->
  <pre id="uitkomst"></pre>
  <script src="vendor/qrcode.js"></script>
  <script src="epc.js"></script>
  <script src="factuur.js"></script>
  <script src="herinnering.js"></script>
  <script>
    var regels = [], mis = 0;
    function gelijk(naam, echt, verwacht) {
      var ok = JSON.stringify(echt) === JSON.stringify(verwacht);
      if (!ok) mis++;
      regels.push((ok ? 'ok   ' : 'FOUT ') + naam + (ok ? '' : '\n     kreeg    ' + JSON.stringify(echt) + '\n     verwacht ' + JSON.stringify(verwacht)));
    }

    gelijk('IBAN geldig', EPC.ibanGeldig('NL23 RABO 0105 5028 55'), true);
    gelijk('IBAN fout controlegetal', EPC.ibanGeldig('NL23RABO0105502856'), false);
    gelijk('IBAN DE geldig', EPC.ibanGeldig('DE89370400440532013000'), true);
    gelijk('IBAN te kort', EPC.ibanGeldig('NL23RABO'), false);
    gelijk('IBAN formatteren', EPC.formatteerIban('nl23rabo0105502855'), 'NL23 RABO 0105 5028 55');

    gelijk('bedrag 9669,30', EPC.bedragInCenten('9669,30'), 966930);
    gelijk('bedrag 9.669,30', EPC.bedragInCenten('9.669,30'), 966930);
    gelijk('bedrag 9669.30', EPC.bedragInCenten('9669.30'), 966930);
    gelijk('bedrag 9,669.30', EPC.bedragInCenten('9,669.30'), 966930);
    gelijk('bedrag 1.250 (duizendtal)', EPC.bedragInCenten('1.250'), 125000);
    gelijk('bedrag 12,5', EPC.bedragInCenten('12,5'), 1250);
    gelijk('bedrag € 12', EPC.bedragInCenten('€ 12'), 1200);
    gelijk('bedrag ,50', EPC.bedragInCenten(',50'), 50);
    gelijk('bedrag leeg', EPC.bedragInCenten(''), null);
    gelijk('bedrag onzin', isNaN(EPC.bedragInCenten('abc')), true);
    gelijk('bedrag 1,2,3', isNaN(EPC.bedragInCenten('1,2,3')), true);
    gelijk('bedrag 12.34.56', isNaN(EPC.bedragInCenten('12.34.56')), true);
    gelijk('bedrag 1.234.567,89', EPC.bedragInCenten('1.234.567,89'), 123456789);
    gelijk('bedrag 1,250 (duizendtal)', EPC.bedragInCenten('1,250'), 125000);
    gelijk('bedrag 1.2', EPC.bedragInCenten('1.2'), 120);
    gelijk('bedrag 1.234,567', isNaN(EPC.bedragInCenten('1.234,567')), true);
    gelijk('bedrag -5', isNaN(EPC.bedragInCenten('-5')), true);
    gelijk('bedrag tekst', EPC.centenNaarTekst(966930), '€ 9.669,30');

    gelijk('RF-kenmerk geldig', EPC.rfKenmerkGeldig('RF18 5390 0754 7034'), true);
    gelijk('RF-kenmerk ongeldig', EPC.rfKenmerkGeldig('RF19 5390 0754 7034'), false);
    gelijk('SEPA-tekens', EPC.sepaTekst('Café & co ™'), 'Cafe + co');

    var r = EPC.maak({ naam: 'B.V. Bouwbedrijf Hoffman Beltrum-Zutphen', iban: 'NL23 RABO 0105 5028 55', bic: 'RABONL2U', bedrag: '9.669,30', omschrijving: 'Factuur 2632601' });
    gelijk('Hoffman ok', r.ok, true);
    gelijk('Hoffman payload', r.payload,
      'BCD\n002\n1\nSCT\nRABONL2U\nB.V. Bouwbedrijf Hoffman Beltrum-Zutphen\nNL23RABO0105502855\nEUR9669.30\n\n\nFactuur 2632601');

    var rf = EPC.maak({ naam: 'Test', iban: 'NL23RABO0105502855', bedrag: '1', omschrijving: 'RF18 5390 0754 7034' });
    gelijk('RF in kenmerkregel', rf.payload, 'BCD\n002\n1\nSCT\n\nTest\nNL23RABO0105502855\nEUR1.00\n\nRF18539007547034');

    var leeg = EPC.maak({ naam: '', iban: 'xx', bedrag: '', omschrijving: '' });
    gelijk('fouten bij leeg', Object.keys(leeg.fouten).sort(), ['bedrag', 'iban', 'naam']);
    gelijk('BIC fout', Object.keys(EPC.maak({ naam: 'a', iban: 'NL23RABO0105502855', bic: 'RABO', bedrag: '1' }).fouten), ['bic']);
    gelijk('bedrag 0', Object.keys(EPC.maak({ naam: 'a', iban: 'NL23RABO0105502855', bedrag: '0' }).fouten), ['bedrag']);
    gelijk('omschrijving te lang', Object.keys(EPC.maak({ naam: 'a', iban: 'NL23RABO0105502855', bedrag: '1', omschrijving: new Array(142).join('x') }).fouten), ['omschrijving']);
    gelijk('waarschuwing aangepaste naam', EPC.maak({ naam: 'Café', iban: 'NL23RABO0105502855', bedrag: '1', omschrijving: 'x' }).waarschuwingen.length, 1);

    // ---- EPC.lees: een bestaande QR-code lezen ----
    var gelezen = EPC.lees(r.payload);
    gelijk('EPC.lees: IBAN', gelezen && gelezen.iban, 'NL23RABO0105502855');
    gelijk('EPC.lees: bedrag', gelezen && gelezen.centen, 966930);
    gelijk('EPC.lees: naam', gelezen && gelezen.naam, 'B.V. Bouwbedrijf Hoffman Beltrum-Zutphen');
    gelijk('EPC.lees: omschrijving', gelezen && gelezen.omschrijving, 'Factuur 2632601');
    gelijk('EPC.lees: geen EPC', EPC.lees('https://example.org'), null);
    gelijk('EPC.lees: fout IBAN', EPC.lees('BCD\n002\n1\nSCT\n\nX\nNL23RABO0105502856\nEUR1.00'), null);

    // ---- factuur.js: herkenning op tekstregels (opbouw zoals pdflezer.mjs ze maakt) ----
    function pagina(nr, rijen, hoogte) {
      return { nr: nr, hoogte: hoogte || 842, regels: rijen.map(function (r) {
        var delen = r[1].map(function (d) { return { x: d[0], w: d[1].length * 5, s: d[1] }; });
        return { y: r[0], delen: delen, tekst: delen.map(function (d) { return d.s; }).join(' ') };
      }) };
    }
    var p1 = pagina(1, [
      [46, [[94, 'Voorbeeld Schilders B.V.']]],
      [166, [[94, 'Dhr. J. Klant']]],
      [252, [[94, 'Factuurnummer'], [242, 'Uw ordernummer'], [448, 'Datum']]],
      [264, [[94, '2026-0417'], [448, '11-11-2026']]],
      [400, [[94, 'Totaal excl. BTW'], [498, '1.250,00']]],
      [417, [[94, 'BTW 21 %'], [498, '262,50']]],
      [440, [[94, 'Totaal factuurbedrag'], [457, '€'], [498, '1.512,50']]],
      [732, [[94, 'Betalingscondities:'], [200, 'Betalingen binnen 14'], [271, 'dagen na factuurdatum.']]],
      [807, [[94, 'T. 012-3456789'], [200, 'IBAN: NL91 ABNA 0417 1643 00'], [320, 'BTWnr. NL00 123 4567 B01']]],
      [815, [[200, 'BIC:'], [221, 'ABNANL2A']]]
    ]);
    var p2 = pagina(2, [[130, [[84, 'Totaal inclusief B.T.W.: € 1.512,46']]]]);
    var f = Factuur.analyseer([p1, p2]);
    gelijk('factuur: naam uit briefhoofd', f.velden.naam, 'Voorbeeld Schilders B.V.');
    gelijk('factuur: IBAN uit voettekst', f.velden.iban, 'NL91ABNA0417164300');
    gelijk('factuur: BTW-nummer is geen IBAN', (f.alternatieven.iban || []).length, 0);
    gelijk('factuur: BIC', f.velden.bic, 'ABNANL2A');
    gelijk('factuur: totaal factuurbedrag wint van bijlage', f.velden.centen, 151250);
    gelijk('factuur: factuurnummer onder label', f.velden.factuurnummer, '2026-0417');
    gelijk('factuur: factuurdatum onder label', f.velden.factuurdatum, '2026-11-11');
    gelijk('factuur: vervaldatum = datum + 14 dagen', f.velden.vervaldatum, '2026-11-25');
    gelijk('factuur: omschrijving', Factuur.omschrijving(f.velden), 'Factuur 2026-0417');

    var g = Factuur.analyseer([pagina(1, [
      [40, [[60, 'Groen Dak Installaties BV']]],
      [200, [[60, 'Factuurnr.: F-8812'], [400, 'Factuurdatum: 02-11-2026']]],
      [300, [[60, 'Te betalen'], [450, '2.904,00']]],
      [320, [[60, 'Betalingskenmerk: 1234 5678 9012 3456']]],
      [330, [[60, 'Vervaldatum 30-11-2026']]],
      [340, [[60, 'Uw rekening NL20 INGB 0001 2345 67 wordt niet belast.']]],
      [800, [[60, 'Graag overmaken naar NL44 RABO 0123 4567 89 t.n.v. Groen Dak Installaties BV']]]
    ])]);
    gelijk('factuur 2: te betalen', g.velden.centen, 290400);
    gelijk('factuur 2: factuurnummer achter label', g.velden.factuurnummer, 'F-8812');
    gelijk('factuur 2: kenmerk', g.velden.kenmerk, '1234567890123456');
    gelijk('factuur 2: omschrijving = kenmerk', Factuur.omschrijving(g.velden), '1234567890123456');
    gelijk('factuur 2: vervaldatum', g.velden.vervaldatum, '2026-11-30');
    gelijk('factuur 2: rekening van de klant telt niet', g.velden.iban, 'NL44RABO0123456789');
    gelijk('factuur 2: naam via t.n.v.', g.velden.naam, 'Groen Dak Installaties BV');

    var leeg = Factuur.analyseer([pagina(1, [[100, [[60, 'Hallo']]]])]);
    gelijk('factuur zonder gegevens', Object.keys(leeg.velden).length, 0);
    gelijk('bedragen in tekst', Factuur.bedragenIn('BTW 9 % (€ 5.654,56) € 508,91'), [565456, 50891]);
    gelijk('IBAN met spaties en rommel erachter', Factuur.ibansIn('IBAN: NL23 RABO 0105 5028 55 BIC: RABONL2U'), ['NL23RABO0105502855']);

    // ---- herinnering.js: .ics ----
    var ics = Herinnering.maak(r.velden, '2026-11-25', 'AAAA', { uid: 'test', nu: new Date(Date.UTC(2026, 10, 11, 12, 0, 0)), url: 'https://betaal.terhofte.net/' });
    var ontvouwd = ics.replace(/\r\n /g, '');
    gelijk('ics: CRLF overal', /[^\r]\n/.test(ics), false);
    gelijk('ics: regels hooguit 75 octets', ics.split('\r\n').every(function (l) { return new TextEncoder().encode(l).length <= 75; }), true);
    gelijk('ics: hele dag op betaaldatum', /DTSTART;VALUE=DATE:20261125\r\nDTEND;VALUE=DATE:20261126/.test(ontvouwd), true);
    gelijk('ics: titel', ontvouwd.indexOf('SUMMARY:Betalen: € 9.669\\,30 aan B.V. Bouwbedrijf Hoffman Beltrum-Zutphen (Factuur 2632601)') > 0, true);
    var lange = Herinnering.maak({ naam: 'Stichting Met Een Bijzonder Lange Naam Voor Een Test', iban: 'NL23RABO0105502855', centen: 500, omschrijving: 'x' }, '2026-11-25', null, { uid: 't', nu: new Date(0) });
    gelijk('ics: lange naam ingekort in titel', lange.replace(/\r\n /g, '').indexOf('aan Stichting Met Een Bijzonder Lange Naam… (x)') > 0, true);
    gelijk('ics: zonder QR geen bijlage', lange.indexOf('ATTACH') < 0, true);
    gelijk('ics: IBAN in beschrijving', ontvouwd.indexOf('IBAN: NL23 RABO 0105 5028 55') > 0, true);
    gelijk('ics: QR-bijlage', ontvouwd.indexOf('ATTACH;FMTTYPE=image/png;ENCODING=BASE64;VALUE=BINARY;X-FILENAME=betaal-qr.png:AAAA') > 0, true);
    gelijk('ics: twee meldingen', (ontvouwd.match(/BEGIN:VALARM/g) || []).length, 2);
    gelijk('ics: datum als tekst', Herinnering.datumTekst('2026-11-25'), 'woensdag 25-11-2026');
    gelijk('ics: escapen', Herinnering.esc('a;b,c\\d\ne'), 'a\\;b\\,c\\\\d\\ne');
    var lang = Herinnering.vouw('DESCRIPTION:' + new Array(60).join('ë'));
    gelijk('ics: vouwen splitst geen tekens', lang.replace(/\r\n /g, ''), 'DESCRIPTION:' + new Array(60).join('ë'));
    var foutDatum = false; try { Herinnering.maak(r.velden, '25-11-2026'); } catch (e) { foutDatum = true; }
    gelijk('ics: ongeldige datum geweigerd', foutDatum, true);

    var qr = qrcode(0, 'M'); qr.addData(r.payload, 'Byte'); qr.make();
    gelijk('QR gemaakt', qr.getModuleCount() >= 21, true);

    // Voor de controle met een onafhankelijke QR-lezer (tools/test.py): het plaatje als data-URL.
    var pre = document.createElement('pre'); pre.id = 'qr-gif'; pre.textContent = qr.createDataURL(8, 32);
    document.body.appendChild(pre);

    regels.push(mis ? 'MISLUKT: ' + mis : 'ALLE TESTS GESLAAGD');
    document.getElementById('uitkomst').textContent = regels.join('\n');
  </script>
</body>
</html>
