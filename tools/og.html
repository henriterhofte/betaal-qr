<!-- Bron van beeld/og.png (de preview bij delen op social media). tools/maak_beelden.py vult
     QR_DATA_URI en ICOON_SVG in en maakt er met Chrome een PNG van 1200 x 630 van. -->
<html lang="nl">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; }
  .kaart { width: 1200px; height: 630px; box-sizing: border-box; background: #1c2b30; color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; padding: 72px 80px;
    display: flex; align-items: center; justify-content: space-between; gap: 64px; }
  .links { display: flex; flex-direction: column; gap: 28px; max-width: 640px; }
  .merk { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; }
  h1 { margin: 0; font-size: 68px; line-height: 1.05; font-weight: 700; letter-spacing: -1px; }
  .sub { margin: 0; font-size: 26px; line-height: 1.4; color: #b8c7cb; }
  .url { margin: 0; font-size: 22px; color: #4fb3ba; font-weight: 600; }
  .qr { flex: none; background: #fff; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .qr img { width: 260px; height: 260px; image-rendering: pixelated; }
  .qr span { color: #4b5a5e; font-size: 18px; }
</style>
</head>
<body>
  <div class="kaart">
    <div class="links">
      <div class="merk">ICOON_SVG <span>Betaal-QR</span></div>
      <h1>Factuur in je mail? Fluitend betaald.</h1>
      <p class="sub">PDF uit je mail of foto van een papieren factuur: <span style="white-space:nowrap">Betaal-QR</span> vult alles in. Niets overtikken.</p>
      <p class="url">betaal.terhofte.net</p>
    </div>
    <div class="qr">
      <img src="QR_DATA_URI" alt="">
      <span>Lokaal · offline · gratis</span>
    </div>
  </div>
</body>
</html>
