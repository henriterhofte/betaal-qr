# Licentie-informatie voor bestanden waar geen commentaar in kan, en voor de ongewijzigde bibliotheek.
# Zie https://reuse.software/
version = 1

[[annotations]]
path = ["manifest.webmanifest", "icon-192.png", "icon-512.png", "icon-maskable-512.png", "beeld/og.png"]
SPDX-FileCopyrightText = "2026 Henri ter Hofte"
SPDX-License-Identifier = "EUPL-1.2"

[[annotations]]
# Ongewijzigd overgenomen uit de npm-release qrcode-generator 1.4.4; bewust zonder extra kop,
# zodat het bestand byte voor byte gelijk blijft aan het origineel (zie vendor/README.md).
path = "vendor/qrcode.js"
SPDX-FileCopyrightText = "2009 Kazuhiko Arase"
SPDX-License-Identifier = "MIT"

[[annotations]]
# pdf.js 4.10.38 (npm pdfjs-dist), ongewijzigd; zie vendor/README.md.
path = ["vendor/pdfjs/pdf.min.mjs", "vendor/pdfjs/pdf.worker.min.mjs", "vendor/pdfjs/LICENSE"]
SPDX-FileCopyrightText = "2024 Mozilla Foundation"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# jsQR 1.4.0 (npm jsqr), ongewijzigd; zie vendor/README.md.
path = ["vendor/jsqr/jsQR.js", "vendor/jsqr/LICENSE"]
SPDX-FileCopyrightText = "Cosmo Wolfe and jsQR contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# Verzonnen testfacturen (tools/maak_testfacturen.py) en wat de tests ervan verwachten.
path = ["tests/facturen/*.pdf", "tests/facturen/*.jpg", "tests/facturen/*.json"]
SPDX-FileCopyrightText = "2026 Henri ter Hofte"
SPDX-License-Identifier = "EUPL-1.2"

[[annotations]]
# Portret van de maker: niet onder de EUPL; wie forkt, vervangt of verwijdert het.
path = "beeld/henri.jpg"
SPDX-FileCopyrightText = "2015 Henri ter Hofte"
SPDX-License-Identifier = "LicenseRef-AlleRechtenVoorbehouden"

[[annotations]]
# Tesseract.js 5.1.1 (npm tesseract.js) en tesseract.js-core 5.1.1, ongewijzigd; bevatten ook kleine
# MIT/BSD-onderdelen (regenerator-runtime, buffer, ieee754, zlib.js). Zie vendor/README.md.
path = ["vendor/tesseract/tesseract.esm.min.js", "vendor/tesseract/worker.min.js", "vendor/tesseract/LICENSE",
        "vendor/tesseract/core/tesseract-core-simd-lstm.wasm.js", "vendor/tesseract/core/tesseract-core-lstm.wasm.js",
        "vendor/tesseract/core/LICENSE"]
SPDX-FileCopyrightText = "Jerome Wu, Balearica and Tesseract.js contributors"
SPDX-License-Identifier = "Apache-2.0 AND MIT AND BSD-3-Clause"

[[annotations]]
# Nederlands taalmodel (tessdata_best, integer), via npm @tesseract.js-data/nld 1.0.0 (verpakking MIT).
path = "vendor/tesseract/lang/nld.traineddata.gz"
SPDX-FileCopyrightText = "Google LLC and Tesseract contributors"
SPDX-License-Identifier = "Apache-2.0"
